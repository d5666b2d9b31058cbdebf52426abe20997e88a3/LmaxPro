<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>LmaxPro</title>
		<style>
			:root {
				--bg: #F3F5F5;
				--accent: #28BDB5;
				--accent-secondary: #8C30A6;
				--success: #2B965B;
				--text-secondary: #535E5E;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
				background: var(--bg);
			}

			.backdrop {
				position: fixed;
				inset: 0;
				overflow: hidden;
				background: var(--bg);
			}

			.aurora {
				position: absolute;
				inset: -12% -10%;
				background:
					radial-gradient(circle at 18% 8%, rgba(40, 189, 181, 0.28), transparent 52%),
					radial-gradient(circle at 82% 18%, rgba(140, 48, 166, 0.20), transparent 48%),
					radial-gradient(circle at 50% 100%, rgba(243, 245, 245, 0.0), transparent 60%);
				animation: aurora-drift 9s ease-in-out infinite alternate;
			}

			@keyframes aurora-drift {
				from {
					transform: translate3d(0, 0, 0) scale(1);
				}

				to {
					transform: translate3d(2%, 3%, 0) scale(1.04);
				}
			}

			.shard {
				position: absolute;
				width: var(--size);
				height: var(--size);
				left: var(--x);
				top: var(--y);
				transform: translate(-50%, -50%) rotate(0deg);
				opacity: 0.88;
				animation:
					shard-float var(--drift) ease-in-out infinite,
					shard-spin var(--spin) linear infinite;
				animation-delay: var(--delay), calc(var(--delay) * 0.5);
			}

			.shard svg {
				width: 100%;
				height: 100%;
				display: block;
			}

			@keyframes shard-float {

				0%,
				100% {
					transform: translate(-50%, -50%) rotate(0deg);
				}

				33% {
					transform: translate(calc(-50% + 12px), calc(-50% - 16px)) rotate(120deg);
				}

				66% {
					transform: translate(calc(-50% - 8px), calc(-50% + 10px)) rotate(240deg);
				}
			}

			@keyframes shard-spin {
				to {
					transform: translate(-50%, -50%) rotate(360deg);
				}
			}

			.sparkle-dot {
				position: absolute;
				width: 4px;
				height: 4px;
				border-radius: 50%;
				left: var(--x);
				top: var(--y);
				background: var(--color);
				opacity: 0.35;
				animation: sparkle-pulse var(--dur) ease-in-out infinite alternate;
				animation-delay: var(--delay);
			}

			@keyframes sparkle-pulse {
				from {
					opacity: 0.25;
					transform: scale(0.85);
				}

				to {
					opacity: 1;
					transform: scale(1.15);
				}
			}

			.content {
				position: relative;
				z-index: 2;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
				text-align: center;
			}

			.hero {
				transform: translateY(-52px);
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			.logo {
				width: 64px;
				height: 64px;
				display: grid;
				place-items: center;
				color: var(--accent);
			}

			.logo svg {
				width: 56px;
				height: 56px;
			}

			.title {
				margin-top: 12px;
				font-size: 28px;
				font-weight: 700;
				line-height: 1.15;
				letter-spacing: -0.02em;
				color: var(--accent);
			}

			.tagline {
				margin-top: 8px;
				font-size: 16px;
				font-weight: 400;
				line-height: 1.3;
				color: var(--text-secondary);
			}

			@media (prefers-reduced-motion: reduce) {

				.aurora,
				.shard,
				.sparkle-dot {
					animation: none !important;
				}
			}
		</style>
		<script type="text/javascript">
			document.addEventListener('DOMContentLoaded', function() {
				try {
					window.webkit.messageHandlers.prism_workshop_mix.postMessage("");
				} catch (e) {

				}
			});
		</script>
	</head>
	<body>
		<div class="backdrop" aria-hidden="true">
			<div class="aurora"></div>

			<div class="shard" style="--x:14%; --y:18%; --size:72px; --drift:11s; --spin:18s; --delay:0s;">
				<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M50 8 L86 50 L50 92 L14 50 Z" fill="rgba(40,189,181,0.16)" stroke="rgba(40,189,181,0.30)"
						stroke-width="1" />
				</svg>
			</div>
			<div class="shard" style="--x:82%; --y:22%; --size:56px; --drift:13s; --spin:22s; --delay:1.2s;">
				<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M50 8 L86 50 L50 92 L14 50 Z" fill="rgba(140,48,166,0.16)" stroke="rgba(140,48,166,0.30)"
						stroke-width="1" />
				</svg>
			</div>
			<div class="shard" style="--x:72%; --y:68%; --size:80px; --drift:15s; --spin:16s; --delay:2.4s;">
				<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M50 8 L86 50 L50 92 L14 50 Z" fill="rgba(40,189,181,0.16)" stroke="rgba(40,189,181,0.30)"
						stroke-width="1" />
				</svg>
			</div>

				<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M50 8 L86 50 L50 92 L14 50 Z" fill="rgba(140,48,166,0.16)" stroke="rgba(140,48,166,0.30)"
						stroke-width="1" />
				</svg>
			</div>
			<div class="shard" style="--x:50%; --y:42%; --size:96px; --drift:17s; --spin:26s; --delay:0.8s;">
				<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M50 8 L86 50 L50 92 L14 50 Z" fill="rgba(40,189,181,0.16)" stroke="rgba(40,189,181,0.30)"
						stroke-width="1" />
				</svg>
			</div>
			<div class="shard" style="--x:38%; --y:52%; --size:48px; --drift:10s; --spin:14s; --delay:4s;">
				<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M50 8 L86 50 L50 92 L14 50 Z" fill="rgba(43,150,91,0.16)" stroke="rgba(43,150,91,0.30)"
						stroke-width="1" />
				</svg>
			</div>

			<span class="sparkle-dot" style="--x:18%; --y:22%; --color:#28BDB5; --dur:1.6s; --delay:0s;"></span>
			<span class="sparkle-dot" style="--x:35%; --y:14%; --color:#8C30A6; --dur:1.95s; --delay:0.45s;"></span>
			<span class="sparkle-dot" style="--x:52%; --y:28%; --color:#28BDB5; --dur:2.3s; --delay:0.9s;"></span>
			<span class="sparkle-dot" style="--x:69%; --y:18%; --color:#8C30A6; --dur:1.6s; --delay:1.35s;"></span>
			<span class="sparkle-dot" style="--x:86%; --y:32%; --color:#28BDB5; --dur:1.95s; --delay:1.8s;"></span>
			<span class="sparkle-dot" style="--x:24%; --y:58%; --color:#8C30A6; --dur:2.3s; --delay:2.25s;"></span>
			<span class="sparkle-dot" style="--x:41%; --y:72%; --color:#28BDB5; --dur:1.6s; --delay:2.7s;"></span>
			<span class="sparkle-dot" style="--x:58%; --y:64%; --color:#8C30A6; --dur:1.95s; --delay:3.15s;"></span>
			<span class="sparkle-dot" style="--x:75%; --y:78%; --color:#28BDB5; --dur:2.3s; --delay:3.6s;"></span>
			<span class="sparkle-dot" style="--x:92%; --y:66%; --color:#8C30A6; --dur:1.6s; --delay:4.05s;"></span>
		</div>

		<main class="content">
			<div class="hero">
				<div class="logo" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M9.5 2.5 8 7l-4.5 1.5L8 10l1.5 4.5L11 10l4.5-1.5L11 7 9.5 2.5Zm5 5L15 10l-2.5 1 1 2.5 2.5-1 2.5 1 1-2.5L15 10l-.5-2.5ZM6 13l-1.5 3L1 17.5 4.5 19 6 22l1.5-3 3.5-1.5L6 16l-1.5-3Zm12 0-1.5 3-3.5 1.5L18 22l1.5-3 3.5-1.5L18 16l-1.5-3Z" />
					</svg>
				</div>
				<h1 class="title">LmaxPro</h1>
				<p class="tagline">V1.0</p>
			</div>
		</main>
	</body>
</html>
